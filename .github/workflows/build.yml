name: Build Resonance APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Build the app
        shell: bash
        run: |
          set -o pipefail
          if gradle assembleDebug --console=plain 2>&1 | tee build.log; then
            exit 0
          fi
          # Surface the errors as annotations so they're readable without the full log.
          grep -E '^e: |error:|Could not|Unresolved' build.log | grep -v '> Task' | head -40 > errors.txt || true
          awk '/What went wrong/{f=1} f{print} /Try:/{if(f) exit}' build.log | head -30 >> errors.txt || true
          split -l 8 errors.txt chunk_
          for f in chunk_*; do
            msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
          done
          exit 1

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Resonance.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-APK
          path: Resonance.apk

      # Publish a direct download link: .../releases/latest/download/Resonance.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Resonance build ${{ github.run_number }}
          body: Install Resonance.apk on your Android phone.
          files: Resonance.apk
          make_latest: true
